name = "typing-royale"
main = "src/maintenance.js"
workers_dev = true
preview_urls = false
compatibility_date = "2026-09-01"

# 등급분류 전 운영 배포에는 게임 파일을 포함하지 않는다. 로컬 게임은 npm run dev로 실행한다.

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]   # 무료 플랜의 Durable Object는 SQLite 백엔드만 된다

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Matchmaker"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]   # 빠른 시작 매치메이커(전역 하나)

# 계정 DB (카카오 로그인·재화·랭크)
[[d1_databases]]
binding = "DB"
database_name = "typing-royale"
database_id = "e788aaa3-4ef8-4e70-ae1f-b1c011db5011"
migrations_dir = "migrations"

# IP별 요청 제한. 경로 묶음마다 따로 센다(src/index.js RATE_BUCKETS)
[[ratelimits]]
name = "RL"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60
  period = 60

# 속도 검사에 걸린 사람 같은 경고를 대시보드에서 볼 수 있게 남긴다
[observability]
enabled = true

[observability.logs]
invocation_logs = false
